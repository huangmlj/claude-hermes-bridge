        function showLoading(show = true) {
            document.getElementById('message-loading').style.display = show ? 'flex' : 'none';
        }

        // Controls
        async function startDiscussion() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content) return;

            const btn = document.getElementById('btn-send');
            const originalBtn = btn.innerHTML;
            btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,0.35);border-top-color:#fff;"></div><span class="send-button-copy"><span class="send-button-title">创建中</span><span class="send-button-subtitle">正在保存讨论主题</span></span>';
            btn.disabled = true;

            const result = await api('/api/discussion/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: content })
            });

            btn.innerHTML = originalBtn;
            btn.disabled = false;

            if (result && result.success) {
                input.value = '';
                document.getElementById('btn-start-ai').style.display = 'inline-flex';
                setCurrentTopic(content, {
                    statusLabel: '话题已创建',
                    statusMeta: '现在可以继续发言，或立即启动 AI 对话',
                    tip: '如果想让讨论更快展开，下一步可以点击“开始AI对话”。'
                });
                autoResize();
            }
        }

        async function startAIAConversation() {
            // 如果正在结束讨论，不执行启动
            if (isEndingInProgress) {
                showNotification('正在结束讨论中，请稍候...', 'warning');
                return;
            }
            const btn = document.getElementById('btn-start-ai');
            if (!btn || btn.disabled) return; // 防止重复点击
            const originalBtn = btn.innerHTML;
            btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></div><span class="inline-action-copy"><span class="inline-action-title">启动中</span><span class="inline-action-subtitle">正在唤起 AI 对话</span></span>';
            btn.disabled = true;

            const result = await api('/api/discussion/start-ai', { method: 'POST' });

            if (result && result.success) {
                btn.style.display = 'none';
                document.getElementById('btn-end').style.display = 'none';
                document.getElementById('btn-pause-ai').style.display = 'inline-flex';
                // 立刻更新轮询服务状态
                const pollDot = document.getElementById('poll-status');
                const pollText = document.getElementById('poll-status-text');
                pollDot.className = 'status-indicator online';
                pollText.textContent = '运行中';
                // 显示 AI 正在思考
                showAIThinking();
                showNotification('AI 对话已启动', 'success');
            } else {
                btn.innerHTML = originalBtn;
                btn.disabled = false;
                showNotification('启动失败: ' + (result?.error || '未知错误'), 'error');
            }
        }

        async function endDiscussion() {
            // 检查是否有消息
            const messages = document.querySelectorAll('.message');
            if (messages.length === 0) {
                showNotification('空白对话无法归档', 'warning');
                return;
            }

            // 设置标志，防止 checkStatus 轮询干扰
            isEndingInProgress = true;

            // 保存所有按钮的引用
            const endBtn = document.getElementById('btn-end');
            const pauseBtn = document.getElementById('btn-pause-ai');
            const startBtn = document.getElementById('btn-start-ai');

            // 保存当前被点击的按钮（endBtn 或 pauseBtn）
            const activeBtn = pauseBtn.style.display !== 'none' ? pauseBtn : endBtn;

            // 保存所有按钮的原始状态
            const endBtnOriginalHTML = endBtn.innerHTML;
            const pauseBtnOriginalHTML = pauseBtn.innerHTML;
            const endBtnOriginalDisplay = endBtn.style.display;
            const pauseBtnOriginalDisplay = pauseBtn.style.display;
            const startBtnOriginalDisplay = startBtn.style.display;

            // 禁用所有操作按钮，防止重复点击
            endBtn.disabled = true;
            pauseBtn.disabled = true;
            startBtn.disabled = true;

            // 超时处理 - 10秒超时
            const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => reject(new Error('请求超时，请检查服务器')), 10000);
            });

            const apiPromise = api('/api/discussion/end', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}'
            });

            let result;
            try {
                result = await Promise.race([apiPromise, timeoutPromise]);
            } catch (error) {
                // 超时或请求失败，恢复按钮状态
                endBtn.innerHTML = endBtnOriginalHTML;
                endBtn.style.display = endBtnOriginalDisplay;
                endBtn.disabled = false;
                pauseBtn.innerHTML = pauseBtnOriginalHTML;
                pauseBtn.style.display = pauseBtnOriginalDisplay;
                pauseBtn.disabled = false;
                startBtn.style.display = startBtnOriginalDisplay;
                startBtn.disabled = false;
                showNotification('结束失败: ' + error.message, 'error');
                isEndingInProgress = false;
                return;
            }

            if (result && result.success) {
                // 立即更新 UI，不再等待 checkStatus() 轮询
                hideAIThinking();
                startBtn.style.display = 'inline-flex';
                startBtn.disabled = false;
                endBtn.style.display = 'none';
                endBtn.disabled = false;
                pauseBtn.style.display = 'none';
                pauseBtn.disabled = false;
                resetCurrentTopic();
                updateHeaderTitle('', false, '已结束');
                const pollDot = document.getElementById('poll-status');
                const pollText = document.getElementById('poll-status-text');
                pollDot.className = 'status-indicator';
                pollText.textContent = '停止';
                // 重置输入框占位符为主题输入模式
                document.getElementById('message-input').placeholder = '输入讨论主题... (Ctrl+Enter 发送)';
                showNotification('对话已归档', 'success');
            } else {
                // 恢复按钮状态
                endBtn.innerHTML = endBtnOriginalHTML;
                endBtn.style.display = endBtnOriginalDisplay;
                endBtn.disabled = false;
                pauseBtn.innerHTML = pauseBtnOriginalHTML;
                pauseBtn.style.display = pauseBtnOriginalDisplay;
                pauseBtn.disabled = false;
                startBtn.style.display = startBtnOriginalDisplay;
                startBtn.disabled = false;
                showNotification('结束失败: ' + (result?.error || '未知错误'), 'error');
            }
            // 清除标志
            isEndingInProgress = false;
        }

        // Status check
        async function checkStatus() {
            const data = await api('/api/status');
            if (data) {
                const serverDot = document.getElementById('server-status');
                const serverText = document.getElementById('server-status-text');
                serverDot.className = 'status-indicator online';
                serverText.textContent = '在线';

                const pollDot = document.getElementById('poll-status');
                const pollText = document.getElementById('poll-status-text');
                const input = document.getElementById('message-input');

                if (data.poll_running) {
                    pollDot.className = 'status-indicator online';
                    pollText.textContent = '运行中';
                    // 同步按钮状态（如果在结束操作中，跳过按钮更新）
                    if (!isEndingInProgress) {
                        document.getElementById('btn-start-ai').style.display = 'none';
                        document.getElementById('btn-end').style.display = 'none';
                        document.getElementById('btn-pause-ai').style.display = 'inline-flex';
                    }
                    // 有活跃讨论时，切换到发言模式
                    if (data.discussion_active) {
                        input.placeholder = '输入你的发言... (Ctrl+Enter 发送)';
                    }
                } else {
                    pollDot.className = 'status-indicator';
                    pollText.textContent = '停止';
                    // 同步按钮状态
                    document.getElementById('btn-start-ai').style.display = 'inline-flex';
                    // 只有在有活跃讨论时才显示结束按钮
                    document.getElementById('btn-end').style.display = data.discussion_active ? 'inline-flex' : 'none';
                    document.getElementById('btn-pause-ai').style.display = 'none';
                }

                // 如果有话题但无轮询，说明话题已创建还未启动AI，保持发言模式
                if (data.current_topic && !data.poll_running) {
                    input.placeholder = '输入你的发言... (Ctrl+Enter 发送)';
                }

                // 如果没有话题，恢复主题输入模式
                if (!data.current_topic && !data.discussion_active) {
                    input.placeholder = '输入讨论主题... (Ctrl+Enter 发送)';
                }

                 if (data.current_topic) {
                    setCurrentTopic(data.current_topic, {
                        statusLabel: data.poll_running ? 'AI 对话进行中' : '等待 AI 启动',
                        statusMeta: data.poll_running ? 'Claude 与 Hermes 正在围绕当前主题展开讨论' : '话题已创建，你可以继续补充，或点击开始AI对话',
                        tip: data.poll_running
                            ? '你仍然可以插入自己的观点，新的发言会继续参与后续讨论。'
                            : '如果主题已经定了，下一步建议直接启动 AI 对话。'
                    });
                } else if (!data.discussion_active) {
                    resetCurrentTopic();
                }
            } else {
                document.getElementById('server-status').className = 'status-indicator error';
                document.getElementById('server-status-text').textContent = '离线';
            }
        }

        // Char counter
        function updateCharCount() {
            const input = document.getElementById('message-input');
            const counter = document.getElementById('char-count');
            counter.textContent = input.value.length;
        }

        // Auto-resize textarea
        function autoResize() {
            const input = document.getElementById('message-input');
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 200) + 'px';
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initSSE();
            initSearch();
            initHistorySearch();
            initFilters();
            checkStatus();
            loadAINames();
            setInterval(checkStatus, 10000);

            // Navigation
            document.getElementById('nav-history').addEventListener('click', showHistory);
            document.getElementById('nav-chat').addEventListener('click', hideHistory);
            document.getElementById('btn-close-history').addEventListener('click', hideHistory);

            // Buttons
            document.getElementById('btn-start-ai').addEventListener('click', startAIAConversation);
            document.getElementById('btn-end').addEventListener('click', endDiscussion);
            document.getElementById('btn-pause-ai').addEventListener('click', endDiscussion);
            document.getElementById('btn-send').addEventListener('click', async () => {
                const input = document.getElementById('message-input');
                const content = input.value.trim();
                if (!content) return;

                // 检查是否已初始化话题
                const isTopicSet = currentTopicActive;

                if (!isTopicSet) {
                    await startDiscussion();
                    input.placeholder = '输入你的发言... (Ctrl+Enter 发送)';
                    showNotification('话题已创建，可开始AI对话', 'success');
                    return;
                }

                // 发送消息
                const msg = await api('/api/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author: '用户', content })
                });
                if (!msg) {
                    showNotification('发送失败', 'error');
                } else {
                    input.value = '';
                    updateCharCount();
                    autoResize();
                    refreshMessageView();
                    // 显示 AI 正在思考
                    showAIThinking();
                }
            });

            // Input
            const input = document.getElementById('message-input');
            input.addEventListener('input', () => {
                updateCharCount();
                autoResize();
            });
            input.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('btn-send').click();
                }
            });

            // Export
            document.getElementById('btn-export').addEventListener('click', async () => {
                const messages = document.querySelectorAll('.message');
                if (messages.length === 0) {
                    showNotification('没有对话内容可导出', 'warning');
                    return;
                }
                let content = '# Hermes × Claude 对话导出\n\n';
                const msgList = [];
                messages.forEach(msg => {
                    const author = msg.querySelector('.message-author').textContent;
                    const layer = msg.querySelector('.message-layer').textContent;
                    const text = msg.dataset.content || '';
                    content += `## ${author} (${layer})\n\n${text}\n\n---\n\n`;
                    msgList.push({ author, layer, text });
                });

                // 获取话题
                const topic = getCurrentTopicText();

                // 调用服务端 API 导出
                const result = await api('/api/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, content })
                });

                if (result && result.success) {
                    showNotification('对话已导出到 output 文件夹', 'success');
                } else {
                    showNotification('导出失败: ' + (result?.error || '未知错误'), 'error');
                }
            });

            // Claude 总结
            document.getElementById('btn-claude-summary').addEventListener('click', async () => {
                const messages = document.querySelectorAll('.message');
                if (messages.length === 0) {
                    showNotification('没有对话内容可总结', 'warning');
                    return;
                }
                // 收集所有消息
                let messagesContent = '';
                messages.forEach(msg => {
                    const author = msg.querySelector('.message-author').textContent || '';
                    const layer = msg.querySelector('.message-layer').textContent || '';
                    const text = msg.dataset.content || '';
                    messagesContent += `[${author} ${layer}]: ${text}\n\n`;
                });
                const topic = getCurrentTopicText();

                showNotification('正在生成 Claude 总结...', 'info');
                const result = await api('/api/summary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, ai_type: 'claude', messages_content: messagesContent })
                });
                if (result && result.success) {
                    showNotification('Claude 总结已导出到 output 文件夹', 'success');
                } else {
                    showNotification('总结失败: ' + (result?.error || '未知错误'), 'error');
                }
            });

            // Hermes 总结
            document.getElementById('btn-hermes-summary').addEventListener('click', async () => {
                const messages = document.querySelectorAll('.message');
                if (messages.length === 0) {
                    showNotification('没有对话内容可总结', 'warning');
                    return;
                }
                // 收集所有消息
                let messagesContent = '';
                messages.forEach(msg => {
                    const author = msg.querySelector('.message-author').textContent || '';
                    const layer = msg.querySelector('.message-layer').textContent || '';
                    const text = msg.dataset.content || '';
                    messagesContent += `[${author} ${layer}]: ${text}\n\n`;
                });
                const topic = getCurrentTopicText();

                showNotification('正在生成 Hermes 总结...', 'info');
                const result = await api('/api/summary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, ai_type: 'hermes', messages_content: messagesContent })
                });
                if (result && result.success) {
                    showNotification('Hermes 总结已导出到 output 文件夹', 'success');
                } else {
                    showNotification('总结失败: ' + (result?.error || '未知错误'), 'error');
                }
            });

            resetCurrentTopic();
            updateCharCount();
            refreshMessageView();
        });
    </script>
</body>
</html>
